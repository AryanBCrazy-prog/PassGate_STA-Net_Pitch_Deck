<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GatePass</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#fff; --ink:#131517; --ink-2:rgba(19,21,23,.64); --ink-3:rgba(19,21,23,.44);
  --soft:rgba(19,21,23,.045); --soft-2:rgba(19,21,23,.08); --line:rgba(19,21,23,.09);
  --pink:#D6409F; --orange:#F0813F; --gold:#E6B84A;
  --grad:linear-gradient(90deg,#D6409F,#F0813F 55%,#E6B84A);
  --ok:#14A56A; --ok-l:rgba(20,165,106,.1); --danger:#E5484D; --danger-l:rgba(229,72,77,.1); --warn:#E58A1F; --warn-l:rgba(229,138,31,.12);
  --f:"Plus Jakarta Sans",-apple-system,"Segoe UI",sans-serif;
  --ease:cubic-bezier(.2,.8,.2,1);
}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{font-family:var(--f);color:var(--ink);background:#fff;overflow:hidden;-webkit-font-smoothing:antialiased;
  background-image:radial-gradient(60% 50% at 15% 0%,rgba(214,64,159,.10),transparent 70%),radial-gradient(50% 50% at 90% 10%,rgba(240,129,63,.10),transparent 70%),radial-gradient(60% 60% at 60% 100%,rgba(100,140,255,.08),transparent 70%)}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
input{font:inherit;color:inherit}

/* top bar */
.bar{height:60px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 clamp(14px,3vw,32px);gap:12px;position:relative;z-index:5}
.brand{font-weight:600;font-size:22px;letter-spacing:-.04em;display:flex;align-items:center;gap:8px}
.brand svg{width:20px;height:20px}
.bar .grp{display:flex;gap:8px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:13px 22px;border-radius:12px;background:var(--ink);color:#fff;font-weight:600;font-size:15px;letter-spacing:-.01em;transition:transform .15s var(--ease),background .15s,opacity .15s}
.btn:hover{background:#2a2d30}
.btn:active{transform:scale(.97)}
.btn.gold{background:var(--ink)}
.btn.ghost{background:var(--soft-2);color:var(--ink)}
.btn.ghost:hover{background:rgba(19,21,23,.13)}
.btn.sm{padding:8px 14px;font-size:14px;border-radius:999px}
.btn.sm.on{background:var(--ink);color:#fff}
.btn:disabled{background:var(--soft-2);color:var(--ink-3);cursor:not-allowed;transform:none}

/* stage + device */
#bg{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
.bar{z-index:5}
.stage{position:relative;z-index:1;height:calc(100vh - var(--bar,60px));display:flex;align-items:center;justify-content:center;padding:18px}
.device{position:relative;background:rgba(255,255,255,.8);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);overflow:hidden;border:1px solid var(--line);box-shadow:0 30px 80px rgba(19,21,23,.10),0 2px 6px rgba(19,21,23,.04);transition:width .35s var(--ease),height .35s var(--ease)}
.device.laptop{width:min(1360px,calc(100vw - 44px));height:min(860px,calc(100vh - var(--bar,60px) - 40px));border-radius:24px;font-size:15px}
.device.phone{--h:min(844px,calc(100vh - var(--bar,60px) - 40px));height:var(--h);width:max(340px,calc(var(--h)*.4615));border:9px solid var(--ink);border-radius:46px;font-size:14px}
#screen{position:absolute;inset:0;overflow:auto;scrollbar-width:thin;scrollbar-color:var(--soft-2) transparent}
#screen.dashmode{overflow:hidden}
.compact #screen.dashmode{overflow:auto}

.page{min-height:100%;padding:30px;display:flex;flex-direction:column;align-items:center;gap:18px}
.compact .page{padding:24px 16px;overflow-x:hidden}
.page.center{justify-content:center}
.page>*{animation:rise .55s var(--ease) both}
.page>*:nth-child(2){animation-delay:.05s}.page>*:nth-child(3){animation-delay:.1s}.page>*:nth-child(4){animation-delay:.15s}.page>*:nth-child(5){animation-delay:.2s}.page>*:nth-child(n+6){animation-delay:.25s}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
h1{font-weight:600;font-size:clamp(30px,4.4vw,58px);line-height:1.04;letter-spacing:-.045em;text-align:center}
.compact h1{font-size:32px}
.grad{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.eyebrow{font-size:13px;font-weight:600;color:var(--ink-2);background:var(--soft);padding:6px 12px;border-radius:999px}
.sub{color:var(--ink-2);text-align:center;max-width:460px;line-height:1.45}
.back{align-self:flex-start;font-size:14px;font-weight:500;color:var(--ink-2);background:var(--soft);padding:7px 14px;border-radius:999px}
.back:hover{background:var(--soft-2);color:var(--ink)}
.card{background:var(--soft);border-radius:16px}

/* page 1 */
.map{width:fit-content;max-width:100%;padding:10px;border-radius:22px}
.map svg{display:block;max-width:100%;height:min(540px,calc(100vh - 540px));min-height:180px;width:auto;margin:0 auto}
.compact .map svg{width:100%;height:auto}
.map text{font-family:var(--f)}
@keyframes pulse{0%{transform:scale(1);opacity:.7}100%{transform:scale(2.2);opacity:0}}
.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 2s ease-out infinite}
.chip-note{display:inline-flex;align-items:center;gap:8px;font-size:13px;color:var(--ink-2)}
.chip-note b{background:var(--grad);color:#fff;padding:3px 9px;border-radius:999px;font-weight:600}

/* page 2 */
.cats{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;width:100%;max-width:700px}
.compact .cats{grid-template-columns:1fr}
.cat{padding:18px;text-align:left;display:flex;gap:14px;align-items:center;min-height:90px;border-radius:16px;transition:background .15s,transform .15s var(--ease)}
.cat:hover{background:var(--soft-2);transform:translateY(-2px)}
.cat:active{transform:scale(.98)}
.cat .no{width:42px;height:42px;border-radius:12px;background:#fff;box-shadow:0 1px 3px rgba(19,21,23,.12);display:grid;place-items:center;font-weight:700;flex:none}
.cat:nth-child(1) .no{color:var(--pink)}.cat:nth-child(2) .no{color:var(--danger)}.cat:nth-child(3) .no{color:var(--orange)}.cat:nth-child(4) .no{color:var(--ok)}
.cat b{display:block;font-size:16px;font-weight:600;letter-spacing:-.02em}
.cat small{color:var(--ink-2);display:block;margin-top:2px}
.cats .cat:nth-child(5){grid-column:1/-1;min-height:48px;padding:10px;justify-content:center;background:transparent;border:1.5px dashed var(--soft-2);color:var(--ink-3)}

/* page 3 */
.phonebox{display:flex;width:100%;max-width:400px;border-radius:14px;background:var(--soft);transition:box-shadow .15s}
.phonebox:focus-within,.field:focus,.search:focus{box-shadow:0 0 0 2px var(--ink)}
.phonebox span{padding:0 4px 0 18px;color:var(--ink-2);display:flex;align-items:center;font-weight:600;font-size:18px}
.phonebox input{border:0;outline:0;padding:16px 16px 16px 10px;font-size:20px;font-weight:500;letter-spacing:.04em;width:100%;background:transparent}
.field{width:100%;max-width:400px;border:0;border-radius:14px;padding:16px 18px;outline:0;background:var(--soft);font-size:16px;font-weight:500;transition:box-shadow .15s}
::placeholder{color:var(--ink-3)}

/* page 4 */
.sec{width:100%;max-width:780px}
.sec h3{font-size:13px;font-weight:600;color:var(--ink-2);margin-bottom:10px}
.chips{display:flex;gap:10px;flex-wrap:wrap}
.chip{min-width:54px;padding:11px 18px;background:var(--soft);border-radius:12px;font-weight:600;font-size:16px;transition:background .15s,transform .15s var(--ease)}
.chip:hover{background:var(--soft-2)}
.chip:active{transform:scale(.95)}
.chip.sel{background:var(--ink);color:#fff}
.houses{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.compact .houses{grid-template-columns:repeat(2,1fr)}
.house{padding:12px 14px;background:var(--soft);border-radius:14px;text-align:left;display:flex;align-items:center;gap:12px;transition:background .15s,transform .15s var(--ease);animation:rise .4s var(--ease) both}
.house:hover{background:var(--soft-2);transform:translateY(-2px)}
.house b{font-size:20px;font-weight:700;letter-spacing:-.03em;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.house small{font-weight:600;font-size:.95em}
.searchwrap{width:100%;max-width:480px;position:relative}
.search{width:100%;padding:14px 18px 14px 44px;border:0;border-radius:999px;outline:0;background:var(--soft);font-weight:500;transition:box-shadow .15s}
.searchwrap:before{content:"";position:absolute;left:18px;top:16px;width:11px;height:11px;border:2px solid var(--ink-2);border-radius:50%;z-index:1}
.searchwrap:after{content:"";position:absolute;left:29px;top:28px;width:6px;height:2px;border-radius:2px;background:var(--ink-2);transform:rotate(45deg);z-index:1}
.results{margin-top:10px;max-height:240px;overflow:auto;padding:6px;background:#fff;box-shadow:0 10px 30px rgba(19,21,23,.12)}
.results:empty{display:none}
.res{display:flex;align-items:center;gap:12px;padding:8px 10px;width:100%;text-align:left;border-radius:12px}
.res:hover{background:var(--soft)}
.res small{color:var(--ink-2);display:block}
.av{width:44px;height:44px;flex:none;border-radius:50%;overflow:hidden}
.av svg{width:100%;height:100%;display:block}
.empty{color:var(--ink-3);text-align:center;padding:14px;font-size:.92em}

/* modal + toast */
.layer{position:absolute;inset:0;z-index:20;display:none}
.layer.show{display:flex}
#modal{background:rgba(19,21,23,.35);backdrop-filter:blur(4px);align-items:center;justify-content:center;padding:20px}
.dialog{background:#fff;border-radius:24px;box-shadow:0 30px 80px rgba(19,21,23,.25);padding:26px;max-width:400px;width:100%;display:flex;flex-direction:column;gap:16px;text-align:center;align-items:center;animation:rise .35s var(--ease)}
.dialog h3{font-size:22px;font-weight:600;letter-spacing:-.03em}
.dialog dl{display:grid;grid-template-columns:auto 1fr;gap:10px 18px;text-align:left;width:100%;background:var(--soft);border-radius:14px;padding:16px;font-size:.95em}
.dialog dt{color:var(--ink-2)}
.dialog dd{font-weight:600}
.dialog .row{display:flex;gap:10px}
#toast{position:absolute;top:16px;left:50%;transform:translateX(-50%);z-index:30;width:min(440px,calc(100% - 28px));background:#fff;border-radius:18px;box-shadow:0 16px 50px rgba(19,21,23,.18),0 0 0 1px var(--line);padding:14px 16px;display:none;gap:14px;align-items:center;overflow:hidden}
#toast.show{display:flex;animation:drop .5s var(--ease)}
@keyframes drop{from{opacity:0;transform:translate(-50%,-24px) scale(.96)}to{opacity:1;transform:translateX(-50%)}}
#toast .ic{width:42px;height:42px;border-radius:12px;background:var(--ok-l);color:var(--ok);display:grid;place-items:center;flex:none}
#toast.wait .ic{background:var(--warn-l);color:var(--warn)}
#toast .ic svg{width:22px;height:22px}
#toast b{display:block;font-size:16px;font-weight:600;letter-spacing:-.02em}
#toast span{display:block;color:var(--ink-2);font-size:13px;margin-top:2px}
#toast i{position:absolute;left:0;bottom:0;height:3px;background:var(--grad);width:100%;transform-origin:left;animation:shrink 5s linear forwards}
@keyframes shrink{to{transform:scaleX(0)}}

/* dashboard */
.dash{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);grid-template-rows:minmax(0,.82fr) minmax(0,1.18fr);gap:16px;padding:20px;height:100%}
.compact .dash{display:flex;flex-direction:column;height:auto;padding:14px 14px 24px;gap:14px}
.w{min-width:0;padding:16px 18px;display:flex;flex-direction:column;gap:12px;min-height:0;border-radius:20px;animation:rise .55s var(--ease) both}
.w:nth-child(2){animation-delay:.06s}.w:nth-child(3){animation-delay:.12s}.w:nth-child(4){animation-delay:.18s}
.w h4{font-size:14px;font-weight:600;letter-spacing:-.01em;display:flex;align-items:center;gap:8px;flex:none}
.w h4 span{margin-left:auto;color:var(--ink-2);font-weight:500}
.list{overflow:auto;display:flex;flex-direction:column;gap:8px;min-height:0;flex:1;scrollbar-width:thin;scrollbar-color:var(--soft-2) transparent}
.compact .list{max-height:320px;flex:none}

.emerg{background:linear-gradient(135deg,rgba(214,64,159,.07),rgba(240,129,63,.09))}
.emerg .marq{flex:1;min-height:0;display:flex;align-items:center;overflow:hidden;white-space:nowrap;background:#fff;border-radius:16px;box-shadow:0 0 0 1px var(--line)}
.compact .emerg .marq{min-height:90px}
.track{display:inline-block;animation:slide linear infinite;padding-left:25%}
@keyframes slide{to{transform:translateX(-100%)}}
.msg{display:inline-flex;align-items:center;gap:12px;margin-right:64px;font-size:clamp(18px,1.9vw,26px);font-weight:600;letter-spacing:-.03em}
.msg:before{content:"";width:10px;height:10px;border-radius:50%;background:var(--ok);flex:none}
.msg.warn:before{background:var(--warn)}.msg.warn{color:var(--warn)}
.msg.crit:before{background:var(--danger)}.msg.crit{color:var(--danger)}
.stats{display:flex;gap:8px;flex:none}
.stat{flex:1;background:#fff;border-radius:12px;box-shadow:0 0 0 1px var(--line);padding:7px 12px;display:flex;align-items:baseline;gap:8px;min-width:0}
.stat b{font-size:17px;font-weight:700;letter-spacing:-.03em}
.stat small{font-size:11px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.alarm{background:var(--danger-l)!important;animation:beepbg .9s ease-in-out infinite!important}
@keyframes beepbg{50%{background:rgba(229,72,77,.28)}}
.sus{display:none;align-items:center;gap:12px;background:var(--danger);color:#fff;padding:10px 14px;border-radius:14px;animation:beep .9s ease-in-out infinite;flex:none}
.sus.on{display:flex}
.sus .tt{font-weight:700;letter-spacing:-.01em}
.sus small{display:block;font-size:12px;opacity:.92;margin-top:2px}
.sus button{margin-left:auto;background:#fff;color:var(--danger);padding:7px 12px;border-radius:999px;font-weight:600;font-size:12px;flex:none}
@keyframes beep{50%{opacity:.45}}

.sbanner{padding:9px 12px;font-weight:600;font-size:.9em;border-radius:12px;flex:none}
.sbanner.ok{background:var(--ok-l);color:var(--ok)}
.sbanner.bad{background:var(--danger-l);color:var(--danger)}
.sgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;flex:1;min-height:0;align-content:start;overflow:auto}
.compact .sgrid{grid-template-columns:1fr 1fr}
.tile{display:flex;flex-direction:column;align-items:center;text-align:center;gap:4px;padding:8px 6px 6px;border-radius:14px;background:#fff;box-shadow:0 0 0 1px var(--line);position:relative}
.compact .tile{flex-direction:row;text-align:left;padding:9px 10px;gap:10px}
.tile.down{background:var(--danger-l);box-shadow:0 0 0 1px rgba(229,72,77,.4)}
.tile .id{width:26px;height:26px;flex:none;border-radius:9px;background:var(--grad);color:#fff;display:grid;place-items:center;font-size:13px;font-weight:700}
.tile.down .id{background:var(--danger)}
.tile .nm{font-weight:600;font-size:.9em;line-height:1.2;min-width:0}
.st{display:block;font-size:11px;font-weight:600;margin-top:2px}
.st.g{color:var(--ok)}.st.r{color:var(--danger)}.st.c{color:var(--warn);animation:beep .6s ease-in-out infinite}
.led{position:absolute;top:8px;right:8px;width:7px;height:7px;border-radius:50%;background:var(--ok)}
.tile.down .led{background:var(--danger);animation:beep .9s ease-in-out infinite}

.grow{border-radius:14px;background:#fff;box-shadow:0 0 0 1px var(--line)}
.grow .top{display:flex;align-items:center;gap:10px;padding:9px 11px}
.grow .who{flex:1;min-width:0}
.grow .who b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600;letter-spacing:-.01em}
.grow .who small{color:var(--ink-2);font-size:.85em}
.grow.rev{opacity:.55}
.grow.rev .who b{text-decoration:line-through}
.ibtn{width:34px;height:34px;display:grid;place-items:center;border-radius:10px;background:var(--soft);flex:none;transition:background .15s,transform .15s var(--ease)}
.ibtn svg{width:17px;height:17px}
.ibtn:hover{background:var(--soft-2)}
.ibtn:active{transform:scale(.92)}
.ibtn.flag{color:var(--danger)}
.ibtn.flag:hover{background:var(--danger-l)}
.ibtn.flag.done{background:var(--danger);color:#fff}
.logs{border-top:1px solid var(--line);padding:8px 12px;font-size:.85em;color:var(--ink-2);display:none}
.logs.open{display:block}
.logs div{display:flex;gap:12px;padding:2px 0}
.logs time{font-variant-numeric:tabular-nums;color:var(--ink);font-weight:600}
.badge{font-size:10px;font-weight:700;padding:2px 7px;border-radius:999px;background:var(--danger-l);color:var(--danger);margin-left:8px;vertical-align:1px}

.wrow{display:flex;align-items:center;gap:12px;padding:10px 12px;background:#fff;border-radius:14px;box-shadow:0 0 0 1px var(--line);transition:background .3s,color .3s}
.wrow svg{width:20px;height:20px;flex:none;color:var(--warn)}
.wrow.ok{background:var(--ok-l);box-shadow:0 0 0 1px rgba(20,165,106,.35);color:var(--ok);font-weight:700}
.wrow.ok svg{color:var(--ok)}
.wrow small{display:block;font-weight:500;color:var(--ink-2)}
.wrow.ok small{color:var(--ok)}
.wrow .who{flex:1}
.bigbtn{width:100%;flex:none}
.page.split{height:100%;flex-direction:row;gap:36px;padding:28px 32px;align-items:stretch}
.split .info{flex:0 0 300px;display:flex;flex-direction:column;justify-content:center;align-items:flex-start;gap:18px}
.split .info h1,.split .info .sub{text-align:left}
.split .info h1{font-size:clamp(30px,3.6vw,48px)}
.split .map{flex:1;min-width:0;width:auto;max-width:none;height:100%;display:flex;padding:14px}
.split .map svg{width:100%;height:100%;min-height:0;margin:0}
.compact .page.split{flex-direction:column;height:auto;align-items:center}
.compact .split .info{flex:none;align-items:center}
.compact .split .info h1,.compact .split .info .sub{text-align:center}
.compact .split .map{width:100%;height:auto;flex:none}
.compact .split .map svg{height:auto}
.abox{flex:1;min-height:0;overflow:auto;border-radius:16px;background:#fff;box-shadow:0 0 0 1px var(--line);padding:8px;display:flex;flex-direction:column;gap:8px;scrollbar-width:thin}
.compact .abox{flex:none;height:170px}
.abox.flash{animation:flashred 1s ease-in-out infinite}
@keyframes flashred{0%,100%{box-shadow:0 0 0 2px var(--danger);background:#fff}50%{box-shadow:0 0 0 3px var(--danger);background:rgba(229,72,77,.16)}}
.arow{display:flex;gap:12px;align-items:center;padding:10px 12px;border-radius:12px;background:var(--danger-l);color:var(--danger);animation:rise .4s var(--ease);flex:none}
.arow.acked{background:var(--soft);color:var(--ink-2)}
.arow .d{width:10px;height:10px;border-radius:50%;background:currentColor;flex:none}
.arow b{display:block;font-weight:700;font-size:15px}
.arow span{display:block;font-size:13px;color:var(--ink)}
.otp{font-size:11px;font-weight:700;letter-spacing:.06em;font-variant-numeric:tabular-nums;background:var(--soft-2);color:var(--ink);padding:2px 8px;border-radius:999px;margin-left:8px;vertical-align:1px}
[hidden]{display:none!important}
.arow>div{flex:1;min-width:0}
.arow .rv{background:var(--danger);color:#fff;padding:7px 12px;border-radius:999px;font-weight:600;font-size:12px;flex:none}
.arow .rv.done{background:transparent;color:var(--ink-2);padding:0}
.arow time{font-size:12px;opacity:.7;flex:none}
.w h4 .btn.sm{margin-left:auto;padding:5px 12px;font-size:12px;background:var(--danger)}
.tabs{display:flex;background:var(--soft);border-radius:999px;padding:4px;gap:2px}
.tabs button{padding:8px 16px;border-radius:999px;font-size:14px;font-weight:600;color:var(--ink-2);transition:background .2s,color .2s;white-space:nowrap}
.tabs button b{opacity:.4;margin-right:7px}
.tabs button.on{background:#fff;color:var(--ink);box-shadow:0 1px 4px rgba(19,21,23,.12)}
@media(max-width:860px){.bar{height:auto;flex-wrap:wrap;padding:8px 14px}.tabs{order:3;width:100%}.tabs button{flex:1;padding:7px 8px;font-size:13px}}
body[data-tab="2"] #toast,body[data-tab="2"] #modal{display:none!important}

/* sample entry */
.sample{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:16px;padding:20px;height:100%}
.compact .sample{display:flex;flex-direction:column;height:auto;padding:14px 14px 24px}
.sleft,.sright{border-radius:20px;background:var(--soft);padding:16px;display:flex;flex-direction:column;gap:12px;min-height:0;min-width:0;animation:rise .55s var(--ease) both}
.sright{animation-delay:.08s}

.sbadge{align-self:center;flex:none;display:inline-flex;gap:8px;align-items:center;padding:6px 14px;border-radius:999px;font-weight:700;font-size:13px;background:var(--ok-l);color:var(--ok)}
.sbadge:before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor;animation:beep 1.6s ease-in-out infinite}
.sbadge.off{background:var(--danger-l);color:var(--danger)}
.sbadge.listen{background:var(--warn-l);color:var(--warn)}
.pw{flex:1;min-height:0;container-type:size;display:flex;justify-content:center;align-items:center}
.compact .pw{flex:none;height:440px}
.panel{position:relative;font-size:calc(100cqh/30);width:18.6em;height:30em;border-radius:1.6em;padding:1.1em;display:flex;flex-direction:column;gap:.9em;
  background:repeating-linear-gradient(90deg,rgba(255,255,255,.035) 0 1px,transparent 1px 3px),linear-gradient(155deg,#5a5f68 0%,#33363c 38%,#202226 100%);
  box-shadow:0 1.4em 2.6em rgba(19,21,23,.38),0 .2em .5em rgba(19,21,23,.3),inset 0 .12em .12em rgba(255,255,255,.35),inset 0 -.25em .5em rgba(0,0,0,.55),inset 0 0 0 .1em rgba(0,0,0,.4);transition:filter .4s}
.panel.off{filter:grayscale(.85) brightness(.7)}
.screw{position:absolute;width:.7em;height:.7em;border-radius:50%;background:radial-gradient(circle at 35% 30%,#d8dbe0,#6c7078 60%,#2b2d31);box-shadow:0 .05em .1em rgba(0,0,0,.6)}
.screw:after{content:"";position:absolute;left:50%;top:12%;bottom:12%;width:.1em;background:rgba(0,0,0,.55);transform:translateX(-50%) rotate(35deg)}
.screw.a{left:.55em;top:.55em}.screw.b{right:.55em;top:.55em}.screw.c{left:.55em;bottom:.55em}.screw.d{right:.55em;bottom:.55em}
.p-top{display:flex;align-items:center;justify-content:space-between;padding:0 .6em;height:1.6em;margin-top:.2em;flex:none}
.p-brand{font-size:.9em;font-weight:700;letter-spacing:.3em;color:#c9ccd2;text-shadow:0 -.05em 0 rgba(0,0,0,.6)}
.p-led{width:1em;height:1em;border-radius:50%;background:#18d27a;box-shadow:0 0 .8em .2em rgba(24,210,122,.7),inset 0 .1em .15em rgba(255,255,255,.6);transition:background .3s,box-shadow .3s}
.p-led.red{background:#ff4a4f;box-shadow:0 0 .8em .2em rgba(255,74,79,.7),inset 0 .1em .15em rgba(255,255,255,.5)}
.p-led.amber{background:#ffb02e;box-shadow:0 0 .8em .2em rgba(255,176,46,.7),inset 0 .1em .15em rgba(255,255,255,.5);animation:beep .7s ease-in-out infinite}
.p-screen{height:4.4em;flex:none;border-radius:.7em;background:linear-gradient(180deg,#07130e,#0c1f17);box-shadow:inset 0 .2em .5em #000,0 0 0 .18em #15171a,0 .08em 0 .2em rgba(255,255,255,.12);position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden}
.p-screen:after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,rgba(255,255,255,.14),transparent 40%)}
#pdisp{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;font-size:1.8em;letter-spacing:.16em;color:#5cffb0;text-shadow:0 0 .4em rgba(92,255,176,.7);padding-left:.16em}
#pdisp.dim{color:rgba(92,255,176,.28);text-shadow:none}
.panel.off #pdisp{color:#555;text-shadow:none}
.p-pad{display:grid;grid-template-columns:repeat(3,1fr);gap:.55em;flex:1;min-height:0}
.k{border-radius:.6em;font-size:1.3em;font-weight:600;color:#e8eaee;background:linear-gradient(180deg,#4a4e56,#2b2d33);box-shadow:0 .22em 0 #121316,0 .3em .5em rgba(0,0,0,.5),inset 0 .08em .1em rgba(255,255,255,.28);transition:transform .06s,box-shadow .06s;display:grid;place-items:center}
.k:active{transform:translateY(.18em);box-shadow:0 .04em 0 #121316,inset 0 .08em .1em rgba(255,255,255,.2)}
.k.fn{color:#ffb02e}.k.ok{color:#5cffb0}
.panel.off .k{pointer-events:none}
.p-bottom{display:flex;align-items:center;justify-content:space-between;padding:0 .8em;height:1.8em;flex:none}
.p-mic{width:.8em;height:.8em;border-radius:50%;background:radial-gradient(circle,#000 45%,#666 52%,#222)}
.p-grill{width:7em;height:1.4em;background:radial-gradient(circle,#08090b 38%,transparent 44%) 0 0/.55em .55em}
.opts{display:flex;gap:10px;flex:none}
.opts .btn{flex:1;padding:13px 10px}
.opts .btn svg{width:18px;height:18px}
.scenewrap{flex:1;min-height:0;display:flex;border-radius:16px;overflow:hidden;background:#fff;box-shadow:0 0 0 1px var(--line)}
.scenewrap svg{width:100%;height:100%;overflow:visible}
.compact .scenewrap{flex:none}.compact .scenewrap svg{height:auto}
.smsg{flex:none;border-radius:14px;padding:12px 14px;font-weight:700;text-align:center;background:#fff;box-shadow:0 0 0 1px var(--line);color:var(--ink-2);transition:background .3s,color .3s}
.smsg.ok{background:var(--ok-l);color:var(--ok)}
.smsg.bad{background:var(--danger-l);color:var(--danger)}
.slab{fill:rgba(130,190,225,.5);stroke:rgba(255,255,255,.85);transition:transform .7s cubic-bezier(.6,0,.2,1),fill .3s}
.scene.open .slab{transform:translateY(-92px)}
.scene.denied .slab{fill:rgba(229,72,77,.5)}
.scene.denied .gate{animation:shake .35s 2}
@keyframes shake{25%{transform:translateX(-3px)}75%{transform:translateX(3px)}}
.lamp{fill:#9aa0a8;transition:fill .3s}
.scene.open .lamp{fill:#18d27a}.scene.denied .lamp{fill:#ff4a4f;animation:beep .5s infinite}
.person{transition:opacity .5s}
.scene.walk .person{transform:translateX(330px);transition:transform 2.6s cubic-bezier(.4,0,.6,1)}
.scene.fadeout .person{opacity:0}
.leg{transform-box:fill-box;transform-origin:top center}
.scene.walk .leg.a{animation:step .45s infinite alternate}.scene.walk .leg.b{animation:step .45s infinite alternate-reverse}
@keyframes step{from{transform:rotate(-24deg)}to{transform:rotate(24deg)}}
</style>
</head>
<body>
<header class="bar">
  <div class="brand">GatePass<svg viewBox="0 0 24 24"><path d="M12 2l2.2 7.8L22 12l-7.8 2.2L12 22l-2.2-7.8L2 12l7.8-2.2z" fill="url(#bg)"/><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#D6409F"/><stop offset="1" stop-color="#E6B84A"/></linearGradient></defs></svg></div>
  <nav class="tabs"><button class="on" data-act="tab" data-t="1"><b>1</b>Guard interface</button><button data-act="tab" data-t="2"><b>2</b>Sample entry</button></nav>
  <div class="grp">
    <button class="btn sm ghost" data-act="mode" data-m="laptop" id="m-laptop">Laptop</button>
    <button class="btn sm ghost" data-act="mode" data-m="phone" id="m-phone">Phone</button>
    <button class="btn sm" data-act="restart">↺ Restart</button>
  </div>
</header>
<canvas id="bg"></canvas>
<main class="stage">
  <div id="device" class="device laptop">
        <div id="screen"></div>
    <div id="modal" class="layer"></div>
    <div id="toast"></div>
  </div>
</main>

<script>
/* ------------------------------------------------------------------ config */
// Point this at an SMS gateway of yours (expects POST {to, message}). Left empty, the OTP is only simulated.
const CONFIG = { smsEndpoint: '' };
const WINGS = ['A','B','C','D','E'];

/* ------------------------------------------------------------------ people */
const COMMUNITIES = [
  { w:79, sur:['Sharma','Mishra','Tiwari','Iyer','Iyengar','Nair','Menon','Pillai','Reddy','Naidu','Rao','Gowda','Patil','Deshmukh','Kulkarni','Joshi','Gupta','Agarwal','Bansal','Yadav','Kushwaha','Patel','Chauhan','Rathore','Thakur','Verma','Jatav','Paswan','Valmiki','Gaikwad','Meena','Banerjee','Chatterjee','Mukherjee','Das','Bose'],
    m:['Rajesh','Suresh','Anil','Vikram','Sanjay','Arvind','Mahesh','Prakash','Ramesh','Deepak','Ashok','Manoj','Harish','Naveen','Sunil','Srinivas','Amit','Rohit','Karthik'],
    f:['Sunita','Meera','Lakshmi','Kavita','Anjali','Preeti','Radha','Savita'] },
  { w:14, sur:['Khan','Siddiqui','Ansari','Qureshi','Sheikh','Mirza','Pathan','Syed'],
    m:['Imran','Irfan','Salman','Farhan','Javed','Aslam','Rashid','Tariq','Shahid','Nadeem'], f:['Fatima','Shabana','Nazia','Rukhsar'] },
  { w:2.5, sur:["D'Souza",'Fernandes','Pereira','Thomas','Mathew','Joseph'],
    m:['John','George','Joseph','Anthony','Francis','Michael'], f:['Mary','Grace','Susan'], },
  { w:2, sur:['Singh','Gill','Sandhu','Bedi','Dhillon'], m:['Gurpreet','Harpreet','Jaspal','Manjit','Balwinder','Amarjeet'], f:['Simran','Jasleen'], sikh:true },
  { w:1.2, sur:['Jain','Shah','Mehta','Doshi'], m:['Pradeep','Nilesh','Hitesh','Mukesh','Jignesh'], f:['Nirmala','Hetal'] },
  { w:0.8, sur:['Irani','Mistry','Dastur'], m:['Cyrus','Darius','Farhad','Rustom'], f:['Roshan','Perin'] },
  { w:0.5, sur:['Meshram','Kamble','Wankhede'], m:['Rahul','Sidharth','Milind'], f:['Ramabai','Sujata'] },
];
function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function pick(r,a){return a[Math.floor(r()*a.length)]}
function genSociety(){
  const r = rng(Date.now()&0xffffffff), total = COMMUNITIES.reduce((a,c)=>a+c.w,0);
  const soc = {};
  WINGS.forEach(w=>{ soc[w]={}; for(let f=1;f<=5;f++){ soc[w][f]=[]; for(let h=1;h<=8;h++){
    let x=r()*total, c=COMMUNITIES[0]; for(const k of COMMUNITIES){ if((x-=k.w)<0){c=k;break} }
    const female = r()<.17;
    soc[w][f].push({ wing:w, floor:f, house:h, last:pick(r,c.sur), first:pick(r,female?c.f:c.m), female,
      look:{bg:pick(r,['#FDF4E5','#DDE2F3','#DCEFE4','#F8ECD6','#F6E3B4']),skin:pick(r,['#F1C9A5','#D9A47B','#B9805A','#8D5A3B']),hair:pick(r,['#1d1511','#2b1b12','#3a2a20','#6b6b6b']),sikh:!!c.sikh&&!female,beard:!female&&r()<.35,glasses:r()<.25,turban:pick(r,['#D4A437','#1A2A6C','#2B2B2B','#B3372B'])} });
  }}});
  return soc;
}
function avatar(p){
  const l=p.look;
  return `<svg viewBox="0 0 48 48"><rect width="48" height="48" fill="${l.bg}"/>
  <path d="M6 48c2-11 10-14 18-14s16 3 18 14z" fill="${p.female?'#D4A437':'#1A2A6C'}"/>
  <circle cx="24" cy="22" r="10" fill="${l.skin}"/>
  ${l.sikh?`<path d="M13 21c0-9 5-13 11-13s11 4 11 13c-4-4-8-5-11-5s-7 1-11 5z" fill="${l.turban}"/>`
    : p.female?`<path d="M13 24c-1-11 4-15 11-15s12 4 11 15c-1-6-4-9-11-9s-10 3-11 9z" fill="${l.hair}"/><path d="M13 24c0 6 2 9 3 10l1-14z M35 24c0 6-2 9-3 10l-1-14z" fill="${l.hair}"/>`
    :`<path d="M14 20c0-8 4-11 10-11s10 3 10 11c-3-4-6-5-10-5s-7 1-10 5z" fill="${l.hair}"/>`}
  ${l.beard?`<path d="M15 24c0 8 4 11 9 11s9-3 9-11c-2 3-5 4-9 4s-7-1-9-4z" fill="${l.hair}" opacity=".9"/>`:''}
  <circle cx="20.5" cy="22" r="1.2" fill="#0B1336"/><circle cx="27.5" cy="22" r="1.2" fill="#0B1336"/>
  ${l.glasses?`<g fill="none" stroke="#0B1336" stroke-width="1"><circle cx="20.5" cy="22" r="3.2"/><circle cx="27.5" cy="22" r="3.2"/><path d="M23.7 22h.6"/></g>`:''}
  </svg>`;
}

/* ------------------------------------------------------------------ icons */
const ICON = {
  check:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
  wait:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',
  flag:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 21V4M5 4h11l-2 4 2 4H5"/></svg>',
  dots:'<svg viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg>',
};

/* ------------------------------------------------------------------ state */
let S, SM, tab = 1, mode = 'laptop', gid = 0, toastTimer;
const $=s=>document.querySelector(s);
const fmt=t=>new Date(t).toLocaleTimeString('en-GB');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const CATS = {
  delivery:{t:'Delivery Driver',s:'Swiggy, Postal Service',who:'Delivery driver',name:false},
  essential:{t:'Essential Services',s:'Fire fighters, Police',who:'Essential services',name:false},
  unknown:{t:'Unknown, wanting to visit',s:'Needs a resident’s permission',who:'Unknown visitor',name:true},
  relative:{t:'A relative',s:'Checked against the resident list',who:'Relative',name:true},
};
function fresh(){
  gid++;
  S = { page:1, flow:{}, society:genSociety(), alerts:[],
    sensors:[{id:'G',name:'Main gate'}].concat(WINGS.map((w,i)=>({id:String(i+1),name:'Wing '+w}))),
    guests:[], waiting:[], checking:false, uid:0 };
  S.sensors.forEach(s=>{s.down=false;s.reply=''});
  const t=Date.now();
  S.guests.push(
    {id:++S.uid,label:'Zomato delivery',phone:'9810045512',otp:'482915',sub:'Delivery',cp:'Wing C',revoked:false,open:false,logs:[[t-9*60e3,'Main gate'],[t-7*60e3,'Wing C']]},
    {id:++S.uid,label:'Relative · Mrs. Kapoor',phone:'9899230871',otp:'730264',sub:'Relative',cp:'Wing A',revoked:false,open:false,logs:[[t-22*60e3,'Main gate'],[t-20*60e3,'Wing A']]});
  SM={gid:null,sensor:0,buf:'',gate:'idle',walk:false,fade:false,talk:false,busy:false,msg:'',cls:''};
  $('#modal').classList.remove('show'); $('#toast').classList.remove('show');
  render();
}
function later(fn,ms){const g=gid;return setTimeout(()=>{if(g===gid)fn()},ms)}

/* ------------------------------------------------------------------ pages */
function render(){
  const sc=$('#screen'); sc.scrollTop=0;
  if(tab===2){ sc.classList.add('dashmode'); sc.innerHTML=sampleView(); paintSample(); return; }
  const p=S.page;
  sc.classList.toggle('dashmode',p==5);
  sc.innerHTML = p==1?p1():p==2?p2():p==3?p3():p==4?p4():dash();
  if(p==5) paintDash();
}
function mapSVG(){
  const B={A:[150,140],B:[400,110],C:[650,140],D:[200,420],E:[600,420]};
  const ent={A:[150,180],B:[400,150],C:[650,180],D:[200,380],E:[600,380]};
  const bd=w=>{const [x,y]=B[w];return `<rect x="${x-65}" y="${y-40}" width="130" height="80" rx="16" fill="#fff" stroke="rgba(19,21,23,.12)"/>
    <text x="${x}" y="${y-2}" text-anchor="middle" font-size="30" font-weight="700" letter-spacing="-1" fill="#131517">${w}</text>
    <text x="${x}" y="${y+20}" text-anchor="middle" font-size="11" font-weight="500" fill="rgba(19,21,23,.5)">Wing ${w}</text>`};
  const sn=(x,y,l)=>`<circle class="pulse" cx="${x}" cy="${y}" r="13" fill="#F0813F"/><circle cx="${x}" cy="${y}" r="13" fill="url(#g)" stroke="#fff" stroke-width="3"/><text x="${x}" y="${y+4.5}" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">${l}</text>`;
  const roads='M400 504V150M150 300H650M150 300V180M650 300V180M200 300V380M600 300V380';
  return `<svg viewBox="10 14 780 548"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#D6409F"/><stop offset=".6" stop-color="#F0813F"/><stop offset="1" stop-color="#E6B84A"/></linearGradient></defs>
  <rect x="24" y="24" width="752" height="480" rx="28" fill="#F3F3F4"/>
  <path d="${roads}" stroke="#fff" stroke-width="20" stroke-linecap="round" fill="none"/>
  <circle cx="400" cy="300" r="26" fill="#fff"/>
  ${WINGS.map(bd).join('')}
  <rect x="352" y="494" width="12" height="22" rx="4" fill="#131517"/><rect x="436" y="494" width="12" height="22" rx="4" fill="#131517"/>
  <text x="400" y="545" text-anchor="middle" font-size="13" font-weight="600" fill="rgba(19,21,23,.6)">Main gate</text>
  ${sn(400,504,'G')}${WINGS.map((w,i)=>sn(ent[w][0],ent[w][1],i+1)).join('')}
  </svg>`;
}
function p1(){return `<div class="page split"><div class="info"><span class="eyebrow">Society layout</span><h1>Main gate &amp; <span class="grad">five wings</span></h1>
  <p class="sub">Six sensors keep watch: one at the main gate and one at every wing entrance.</p>
  <div class="chip-note"><b>G · 1–5</b>Sensor positions</div>
  <button class="btn" data-act="start">Begin entry →</button></div>
  <div class="map card">${mapSVG()}</div></div>`}
function p2(){return `<div class="page center"><span class="eyebrow">Step 1 of 3</span><h1>Who’s <span class="grad">entering?</span></h1><p class="sub">Select the type of visitor at the gate.</p>
  <div class="cats">${Object.entries(CATS).map(([k,c],i)=>`<button class="card cat" data-act="cat" data-k="${k}"><span class="no">${i+1}</span><span><b>${c.t}</b><small>${c.s}</small></span></button>`).join('')}
  <button class="card cat" data-act="cat" data-k="blank">—</button></div></div>`}
function formOk(){const f=S.flow;return /^\d{10}$/.test(f.phone||'')&&(!CATS[f.cat].name||!!(f.name&&f.name.trim()))}
function p3(){const f=S.flow, needName=CATS[f.cat].name;return `<div class="page center"><button class="back" data-act="to2">← Back</button><span class="eyebrow">Step 2 of 3</span><h1>${needName?'Name &amp; <span class="grad">phone</span>':'Phone <span class="grad">number</span>'}</h1>
  <p class="sub">The entry code will be sent to this number.</p>
  ${needName?`<input class="field" id="nm" placeholder="Full name" value="${esc(f.name||'')}" autofocus>`:''}
  <div class="phonebox"><span>+91</span><input id="ph" inputmode="numeric" maxlength="10" placeholder="98765 43210" value="${f.phone||''}" ${needName?'':'autofocus'}></div>
  <button class="btn" id="go3" data-act="to4" ${formOk()?'':'disabled'}>Continue →</button></div>`}
function p4(){
  const f=S.flow, W=f.b, F=f.floor;
  return `<div class="page"><button class="back" data-act="to3">← Back</button><span class="eyebrow">Step 3 of 3</span><h1>Where are they <span class="grad">going?</span></h1>
  <div class="searchwrap"><input class="search" id="q" placeholder="Search by family name" autocomplete="off"><div class="results card" id="res"></div></div>
  <div class="sec"><h3>Wing</h3><div class="chips">${WINGS.map(w=>`<button class="chip ${W==w?'sel':''}" data-act="wing" data-v="${w}">${w}</button>`).join('')}</div></div>
  ${W?`<div class="sec"><h3>Floor</h3><div class="chips">${[1,2,3,4,5].map(n=>`<button class="chip ${F==n?'sel':''}" data-act="floor" data-v="${n}">${n}</button>`).join('')}</div></div>`:''}
  ${W&&F?`<div class="sec"><h3>House</h3><div class="houses">${S.society[W][F].map((p,i)=>`<button class="house" style="animation-delay:${i*.04}s" data-act="house" data-w="${W}" data-f="${F}" data-h="${p.house}"><b>${p.house}</b><small>${esc(p.last)}</small></button>`).join('')}</div></div>`:''}
  </div>`}

/* ------------------------------------------------------------------ flow */
function who(){return S.flow.name||CATS[S.flow.cat]?.who||'Guest'}
function toast(o){ // message shown over the dashboard for 5 seconds
  const t=$('#toast'); clearTimeout(toastTimer);
  t.className=''; void t.offsetWidth;
  t.innerHTML=`<div class="ic">${o.wait?ICON.wait:ICON.check}</div><div><b>${o.title}</b>${o.sub?`<span>${o.sub}</span>`:''}${o.note?`<span>${o.note}</span>`:''}</div><i></i>`;
  t.className='show'+(o.wait?' wait':'');
  toastTimer=later(()=>t.classList.remove('show'),5000);
}
function admit(info){
  const own=!info; info=info||{label:who(),phone:S.flow.phone,otp:S.flow.otp,sub:CATS[S.flow.cat].who};
  const t=Date.now(), g={id:++S.uid,label:info.label,phone:info.phone,otp:info.otp,sub:info.sub,cp:'Main gate',revoked:false,open:false,logs:[[t,'Main gate']]};
  S.guests.unshift(g); if(own) S.flow.guest=g; return g;
}
function sendOtp(phone){
  const otp=String(Math.floor(100000+Math.random()*900000));
  const msg=`Your society entry OTP is ${otp}. Enter it at each checkpoint.`;
  if(CONFIG.smsEndpoint) fetch(CONFIG.smsEndpoint,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({to:'+91'+phone,message:msg})}).catch(()=>{});
  return {otp,note:`OTP sent to +91 ${phone.slice(0,5)} ${phone.slice(5)}`};
}
function finish(o){ S.page=5; render(); if(o) toast(o); startSim(); }
function confirmHouse(p){
  const f=S.flow; f.dest=p;
  $('#modal').innerHTML=`<div class="dialog"><h3>Confirm entry</h3><dl><dt>Visitor</dt><dd>${esc(who())}</dd><dt>Phone</dt><dd>+91 ${f.phone}</dd><dt>Going to</dt><dd>Wing ${p.wing} · Floor ${p.floor} · House ${p.house}</dd><dt>Family</dt><dd>${esc(p.last)}</dd></dl>
  <div class="row"><button class="btn ghost" data-act="cancel">Cancel</button><button class="btn" data-act="confirm">Confirm</button></div></div>`;
  $('#modal').classList.add('show');
}
function doConfirm(){
  $('#modal').classList.remove('show');
  const f=S.flow, {otp,note}=sendOtp(f.phone); f.otp=otp;
  if(f.cat==='delivery'){ admit(); finish({title:'Access granted',sub:'Verified by Swiggy',note}); }
  else if(f.cat==='relative'){ admit(); finish({title:'Access granted',sub:'On resident list',note}); }
  else { S.waiting.push({id:++S.uid,name:who(),label:who(),phone:f.phone,otp,sub:CATS[f.cat].who,dest:`Wing ${f.dest.wing} · ${f.dest.last}`,ok:false});
    finish({title:'Waiting for resident permission',sub:`Wing ${f.dest.wing} · ${esc(f.dest.last)}`,wait:true,note}); }
}
function chooseCat(k){
  S.flow={cat:k};
  if(k==='blank'){ finish(); }
  else if(k==='essential'){ admit(); finish({title:'Access granted',sub:'Priority entry'}); }
  else { S.page=3; render(); }
}

/* ------------------------------------------------------------------ simulations */
const SIM_MS=30000; // delay before each simulated event
function startSim(){
  const f=S.flow, k=f.cat, b=f.dest?WINGS.indexOf(f.dest.wing):-1;
  if(k==='delivery' && f.guest){
    later(()=>{
      const pool=[0,1,2,3,4].filter(i=>i!==b), x=pool.splice(Math.floor(Math.random()*pool.length),1)[0], y=pool[Math.floor(Math.random()*pool.length)];
      const g=f.guest, t=Date.now();
      g.logs.push([t,`Sensor ${x+1} · Wing ${WINGS[x]} (denied)`],[t+1,`Sensor ${y+1} · Wing ${WINGS[y]} (denied)`]); g.cp=`Wing ${WINGS[y]} (denied)`;
      raise('Suspicious activity',`${g.label} tried to enter Wing ${WINGS[x]} and Wing ${WINGS[y]}`,g.id);
    },SIM_MS);
  }
  if(k==='unknown'){
    const w=S.waiting[S.waiting.length-1];
    later(()=>{
      w.ok=true; paintDash();
      later(()=>{ S.waiting=S.waiting.filter(x=>x!==w); admit(w); paintDash(); },SIM_MS);
    },SIM_MS);
  }
  if(k==='relative' && b>=0){
    later(()=>{ const s=S.sensors[b+1]; s.down=true;
      raise('Sensor down',`Sensor ${b+1} · Wing ${WINGS[b]} is not responding`); },SIM_MS);
  }
}
let actx; function beep(){try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();const o=actx.createOscillator(),g=actx.createGain();o.type='square';o.frequency.value=880;g.gain.value=.03;o.connect(g);g.connect(actx.destination);o.start();o.stop(actx.currentTime+.12)}catch(e){}}
function alertBtn(a){ const g=a.gid&&S.guests.find(x=>x.id===a.gid); if(!g) return '';
  return g.revoked?'<span class="rv done">OTP revoked</span>':`<button class="rv" data-act="revokealert" data-id="${g.id}">Revoke OTP</button>`; }
function revoke(g){ if(g.revoked) return; g.revoked=true; g.logs.push([Date.now(),'Entry code revoked by guard']); }
const unacked=()=>S.alerts.some(a=>!a.ack);
function raise(title,text,gid){ S.alerts.push({title,text,gid,time:Date.now(),ack:false}); paintDash(); alarm(); }
function alarm(){let n=0;const g=gid;const iv=setInterval(()=>{if(g!==gid||!unacked()||++n>10)return clearInterval(iv);beep()},900)}

/* ------------------------------------------------------------------ dashboard */
function dash(){return `<div class="dash">
  <section class="card w emerg" id="w-em"><h4>Emergency messages <button class="btn sm" data-act="ack" id="ackbtn" hidden>Acknowledge</button></h4><div class="abox" id="alerts"></div>
    <div class="stats"><div class="stat"><b id="st-s">6/6</b><small>Sensors online</small></div><div class="stat"><b id="st-g">0</b><small>Guests inside</small></div><div class="stat"><b id="st-a">0</b><small>Open alerts</small></div></div></section>
  <section class="card w"><button class="btn gold bigbtn" data-act="newguest">＋ Sign in new guest</button><h4>Residents waiting approval</h4><div class="list" id="wait"></div></section>
  <section class="card w"><h4>Sensors</h4><div id="sban"></div><div class="sgrid" id="sens"></div><button class="btn sm ghost" data-act="check">Check all sensors</button></section>
  <section class="card w"><h4>Guests inside <span id="gcount"></span></h4><div class="list" id="guests"></div></section>
</div>`}
const sname=s=>s.id==='G'?'Sensor G · Main gate':`Sensor ${s.id} · ${s.name}`;
function paintDash(){
  paintSample();
  if(S.page!==5||!$('#alerts')) return;
  const un=unacked();
  $('#alerts').classList.toggle('flash',un);
  $('#ackbtn').hidden=!un;
  $('#alerts').innerHTML=S.alerts.slice().reverse().map(a=>`<div class="arow ${a.ack?'acked':''}"><i class="d"></i><div><b>${esc(a.title)}</b><span>${esc(a.text)}</span></div><time>${fmt(a.time)}</time>${alertBtn(a)}</div>`).join('');
  const down=S.sensors.filter(s=>s.down), live=S.guests.filter(g=>!g.revoked).length;
  $('#st-s').textContent=(S.sensors.length-down.length)+'/'+S.sensors.length;
  $('#st-g').textContent=live; $('#st-a').textContent=S.alerts.length;
  $('#sban').innerHTML=down.length?`<div class="sbanner bad">Inactive: ${down.map(sname).join(', ')}</div>`:`<div class="sbanner ok">All sensors are active</div>`;
  $('#sens').innerHTML=S.sensors.map(s=>{
    const r=s.reply==='checking'?'<span class="st c">Checking…</span>':s.reply==='alive'?'<span class="st g">Alive ✓</span>':s.reply==='none'?'<span class="st r">No reply</span>':`<span class="st ${s.down?'r':'g'}">${s.down?'Inactive':'Active'}</span>`;
    return `<div class="tile ${s.down?'down':''}"><span class="id">${s.id}</span><span class="nm">${s.name}${r}</span><i class="led"></i></div>`}).join('');
  $('#wait').innerHTML=S.waiting.length?S.waiting.map(w=>`<div class="wrow ${w.ok?'ok':''}">${w.ok?ICON.check:ICON.wait}<div class="who">${esc(w.name)}<small>${w.ok?'Access granted':'Waiting · '+esc(w.dest)}</small></div></div>`).join(''):'<div class="empty">No one is waiting</div>';
  $('#gcount').textContent=live+' inside';
  $('#guests').innerHTML=S.guests.length?S.guests.map(g=>`<div class="grow ${g.revoked?'rev':''}"><div class="top"><div class="who"><b>${esc(g.label)}${g.otp?`<span class="otp">OTP ${g.otp}</span>`:''}${g.revoked?'<span class="badge">REVOKED</span>':''}</b><small>${g.phone?`+91 ${g.phone.slice(0,5)} ${g.phone.slice(5)} · `:''}${g.sub} · last: ${esc(g.cp)}</small></div>
    <button class="ibtn flag ${g.revoked?'done':''}" title="Revoke entry code" data-act="flag" data-id="${g.id}">${ICON.flag}</button>
    <button class="ibtn" title="Logs" data-act="dots" data-id="${g.id}">${ICON.dots}</button></div>
    <div class="logs ${g.open?'open':''}">${g.logs.map(l=>`<div><time>${fmt(l[0])}</time><span>${esc(l[1])}</span></div>`).join('')}</div></div>`).join(''):'<div class="empty">No guests inside</div>';
}
function checkAll(){
  if(S.checking) return; S.checking=true;
  S.sensors.forEach(s=>s.reply='checking'); paintDash();
  S.sensors.forEach((s,i)=>later(()=>{s.reply=s.down?'none':'alive'; if(i===S.sensors.length-1)S.checking=false; paintDash()},500+i*380));
}

      <rect x="205" y="92" width="70" height="30" rx="7" fill="url(#mt)"/><circle class="lamp" cx="240" cy="107" r="5"/></g>

  </svg>`;
  return `<div class="sample"><section class="sleft"><div class="pickrow"><label>Guest<select id="sg"></select></label><label>Sensor<select id="ss">${S.sensors.map((s,i)=>`<option value="${i}" ${i===SM.sensor?'selected':''}>${s.id==='G'?'Main gate':s.name}</option>`).join('')}</select></label></div>
    <span class="sbadge" id="sbadge">Active</span>
    <div class="pw"><div class="panel" id="panel"><i class="screw a"></i><i class="screw b"></i><i class="screw c"></i><i class="screw d"></i>
      <div class="p-top"><span class="p-brand">GATEPASS</span><span class="p-led" id="pled"></span></div>
      <div class="p-screen"><span id="pdisp"></span></div><div class="p-pad">${keys}</div>
      <div class="p-bottom"><i class="p-mic"></i><i class="p-grill"></i></div></div></div>

    <section class="sright"><div class="scenewrap">${scene}</div><div class="smsg" id="smsg"></div></section></div>`;
}
function paintSample(){
  if(tab!==2||!$('#panel')) return;
  const sel=$('#sg'), gs=S.guests, key=gs.map(g=>g.id+g.label+g.phone).join('|');
  if(sel.dataset.k!==key){ sel.dataset.k=key; sel.innerHTML=gs.length?gs.map(g=>`<option value="${g.id}">${esc(g.label)}${g.phone?` · +91 ${g.phone.slice(0,5)} ${g.phone.slice(5)}`:''}</option>`).join(''):'<option>No guests inside</option>'; }
  const g=smGuest(); if(g){ SM.gid=g.id; sel.value=g.id; }
  const down=smSensor().down, n=smName();
  const b=$('#sbadge'); b.className='sbadge'+(down?' off':SM.talk?' listen':''); b.textContent=down?'Inactive':SM.talk?'Listening':'Active';
  $('#panel').classList.toggle('off',down);
  $('#pled').className='p-led'+(down?' red':SM.talk?' amber':'');
  const d=$('#pdisp'); d.className=(!down&&!SM.talk&&!SM.buf)?'dim':''; d.textContent=down?'OFFLINE':SM.talk?'LISTENING':(SM.buf||'------');
  const lock=down||SM.busy||!g; $('#bspeak').disabled=lock; $('#benter').disabled=lock;
  const sc=$('#scene'); sc.classList.toggle('open',SM.gate==='open'); sc.classList.toggle('denied',SM.gate==='denied');
  sc.classList.toggle('walk',SM.walk); sc.classList.toggle('fadeout',SM.fade);
  $('#sceneName').textContent=n; $('#sceneLed').setAttribute('fill',down?'#ff4a4f':'#18d27a');
  const m=$('#smsg'); m.className='smsg '+(SM.msg?SM.cls:''); m.textContent=SM.msg||(down?`${n} sensor is inactive`:`Waiting at ${n}…`);
}
function smResult(ok,why){
  const g=smGuest(), n=smName(); SM.busy=true; SM.buf=''; SM.talk=false;
  g.logs.push([Date.now(),ok?n:`${n} (denied)`]); g.cp=ok?n:`${n} (denied)`;
  if(ok){
    SM.gate='open'; SM.msg=`Access granted · ${g.label}`+(why?` · ${why}`:''); SM.cls='ok'; paintDash();
    later(()=>{SM.walk=true;paintSample()},450);
    later(()=>{SM.gate='idle';paintSample()},3000);
    later(()=>{SM.fade=true;paintSample()},3200);
    later(()=>{SM.walk=false;SM.fade=false;SM.busy=false;SM.msg='';paintSample()},3800);
  } else {
    SM.gate='denied'; SM.msg=`Access denied · ${why}`; SM.cls='bad'; paintDash();
    later(()=>{SM.gate='idle';SM.busy=false;SM.msg='';paintSample()},2800);
  }
}
function smKey(k){
  if(!S.guests.length||smSensor().down||SM.busy) return;
  if(k==='C') SM.buf=''; else if(k==='BS') SM.buf=SM.buf.slice(0,-1); else if(k==='OK') return smEnter(); else if(SM.buf.length<6) SM.buf+=k;
  paintSample();
}
function smEnter(){
  const g=smGuest(); if(!g||smSensor().down||SM.busy) return;
  if(SM.buf.length<6) return smResult(false,'incomplete OTP');
  if(!g.otp) return smResult(false,'no OTP issued');
  if(g.revoked) return smResult(false,'OTP revoked');
  { const ok=SM.buf===g.otp; smResult(ok,ok?'OTP verified':'wrong OTP'); }
}
function smSpeak(){
  const g=smGuest(); if(!g||smSensor().down||SM.busy) return;
  SM.busy=true; SM.talk=true; SM.buf=''; SM.msg='Listening for the spoken OTP…'; SM.cls=''; paintSample();
  later(()=>{ SM.busy=false; smResult(true,'spoken OTP'); },1400);
}
function setTab(t){ tab=t; document.body.dataset.tab=t; document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('on',+b.dataset.t===t)); render(); }
document.addEventListener('change',e=>{
  if(e.target.id==='sg'){ SM.gid=+e.target.value; SM.buf=''; paintSample(); }
  else if(e.target.id==='ss'){ SM.sensor=+e.target.value; SM.buf=''; paintSample(); }
});
document.addEventListener('keydown',e=>{
  if(tab!==2||/INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName)) return;
  if(/^\d$/.test(e.key)) smKey(e.key); else if(e.key==='Backspace') smKey('BS'); else if(e.key==='Enter') smEnter();
});

/* ------------------------------------------------------------------ events */
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]'); if(!el) return;
  const a=el.dataset.act, d=el.dataset;
  if(a==='restart') fresh();
  else if(a==='tab') setTab(+d.t);
  else if(a==='key') smKey(d.d);
  else if(a==='speak') smSpeak();
  else if(a==='entr') smEnter();
  else if(a==='mode') setMode(d.m);
  else if(a==='start'||a==='to2'||a==='newguest'){ S.flow={}; S.page=2; render(); }
  else if(a==='cat') chooseCat(d.k);
  else if(a==='to3'){ S.page=3; render(); }
  else if(a==='to4'){ S.page=4; render(); }
  else if(a==='wing'){ S.flow.b=d.v; S.flow.floor=null; render(); }
  else if(a==='floor'){ S.flow.floor=+d.v; render(); }
  else if(a==='house'||a==='pick'){ confirmHouse(S.society[d.w][d.f][d.h-1]); }
  else if(a==='cancel') $('#modal').classList.remove('show');
  else if(a==='confirm') doConfirm();
  else if(a==='check') checkAll();
  else if(a==='ack'){ S.alerts.forEach(x=>x.ack=true); paintDash(); }
  else if(a==='flag'){ revoke(S.guests.find(x=>x.id==d.id)); paintDash(); }
  else if(a==='revokealert'){ revoke(S.guests.find(x=>x.id==d.id)); S.alerts.forEach(x=>{if(x.gid==d.id)x.ack=true}); paintDash(); }
  else if(a==='dots'){ const g=S.guests.find(x=>x.id==d.id); g.open=!g.open; paintDash(); }
});
document.addEventListener('input',e=>{
  if(e.target.id==='ph'){ e.target.value=e.target.value.replace(/\D/g,''); S.flow.phone=e.target.value; $('#go3').disabled=!formOk(); }

    const q=e.target.value.trim().toLowerCase(), out=[];

});
function setMode(m){ mode=m; $('#device').className='device '+m; fit();

function fit(){document.documentElement.style.setProperty('--bar',$('.bar').offsetHeight+'px');const d=$('#device');d.classList.toggle('compact',d.classList.contains('phone')||d.clientWidth<760)}

/* ------------------------------------------------------------------ background */
(function(){
  const cv=$('#bg'), x=cv.getContext('2d'); let w,h,dpr,grad;
  function size(){ dpr=Math.min(devicePixelRatio||1,2); w=cv.width=innerWidth*dpr; h=cv.height=innerHeight*dpr;
    grad=x.createLinearGradient(0,0,w,0); grad.addColorStop(0,'rgba(214,64,159,.32)'); grad.addColorStop(.55,'rgba(240,129,63,.32)'); grad.addColorStop(1,'rgba(230,184,74,.32)'); }
  addEventListener('resize',size); size();
  const still=matchMedia('(prefers-reduced-motion: reduce)').matches, L=36;
  function frame(ms){
    const t=ms/1000; x.clearRect(0,0,w,h); x.lineWidth=1.2*dpr;
    for(let i=0;i<L;i++){
      const f=i/(L-1), y0=h*(.04+.94*f); x.beginPath();
      for(let px=0;px<=w;px+=14*dpr){
        const n=px/w, y=y0+Math.sin(n*5+t*.35+i*.22)*h*.04*(.4+f)+Math.sin(n*11-t*.22+i*.5)*h*.012+Math.sin(n*2.2+t*.15)*h*.05*(1-f);
        px?x.lineTo(px,y):x.moveTo(px,y);
      }
      x.strokeStyle=i%6===3?grad:'rgba(19,21,23,.07)'; x.stroke();
    }
    if(!still) requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
